<!DOCTYPE html>
<html style="background-color: black">
<head>
    <!--

      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of

    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta content="Pacman ROLL" name="description">

    <!-- iOS meta tags & icons -->
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black" name="apple-mobile-web-app-status-bar-style">
    <meta content="Pacman ROLL" name="apple-mobile-web-app-title">
    <link href="icons/Icon-192.png" rel="apple-touch-icon">

    <!-- Favicon -->
    <link href="favicon.png" rel="icon" type="image/png">

    <title>Pacman ROLL</title>
    <script>
        // 1. Save the browser's original matchMedia function
        const originalMatchMedia = window.matchMedia;

        // 2. Override it with our own interceptor
        window.matchMedia = function(query) {
          // 3. If Flutter asks about reduced motion, lie and say false
          if (query === '(prefers-reduced-motion: reduce)') {
            return {
              matches: false, // <--- The magic bullet: forces full animations
              media: query,
              onchange: null,
              addListener: function() {},
              removeListener: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
          }
          // 4. Otherwise, let the browser handle it normally (like dark mode checks)
          return originalMatchMedia.apply(this, arguments);
        };
    </script>
    <link href="manifest.json" rel="manifest">
    <style id="splash-screen-style">
        html {
          height: 100%
        }

        body {
          margin: 0;
          min-height: 100%;
          background-color: #000000;
              background-size: 100% 100%;
        }

        .center {
          margin: 0;
          position: absolute;
          top: 50%;
          left: 50%;
          -ms-transform: translate(-50%, -50%);
          transform: translate(-50%, -50%);
        }

        .contain {
          display:block;
          width:100%; height:100%;
          object-fit: contain;
        }

        .stretch {
          display:block;
          width:100%; height:100%;
        }

        .cover {
          display:block;
          width:100%; height:100%;
          object-fit: cover;
        }

        .bottom {
          position: absolute;
          bottom: 0;
          left: 50%;
          -ms-transform: translate(-50%, 0);
          transform: translate(-50%, 0);
        }

        .bottomLeft {
          position: absolute;
          bottom: 0;
          left: 0;
        }

        .bottomRight {
          position: absolute;
          bottom: 0;
          right: 0;
        }
    </style>
    <script id="splash-screen-script">
        function removeSplashFromWeb() {
          document.getElementById("splash")?.remove();
          document.getElementById("splash-branding")?.remove();
          document.body.style.background = "transparent";
        }
    </script>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
          name="viewport">
</head>
<body>
<picture id="splash">
    <source media="(prefers-color-scheme: light)"
            srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x">
    <source media="(prefers-color-scheme: dark)"
            srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x">
    <img alt="" aria-hidden="true" class="center" src="splash/img/light-1x.png">
</picture>
<script>
    {{flutter_js}}
    {{flutter_build_config}}
    const userConfig = {'wasmAllowList': {'gecko': true, 'webkit': true}};
    const searchParams = new URLSearchParams(window.location.search);
    if (searchParams.has('js')) {
        userConfig.renderer = 'canvaskit';
    }
    if (searchParams.has('st')) {
        userConfig.forceSingleThreadedSkwasm = true;
    }
    _flutter.loader.load({config: userConfig});
</script>
<script defer src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js"></script>
<script defer src="assets/packages/flutter_soloud/web/init_module.dart.js"></script>
<!--
  IOS SILENT SWITCH BYPASS & MEDIA CHANNEL ENFORCER:
  Sets WebAudio Session API category to 'playback' on iOS 17+.
  This forces iOS Safari to route WebAudio through the Media Playback output channel
  rather than the Ringer channel, allowing audio to play even when the physical Silent switch is ON.
-->
<script>
  (function() {
    console.log('[iOS-MediaChannel] Script injected.');

    // 1. Force AudioSession to 'playback' mode
    function setPlaybackCategory() {
      if ('audioSession' in navigator) {
        try {
          navigator.audioSession.type = 'playback';
          console.log('[iOS-MediaChannel] navigator.audioSession.type set to "playback" (Silent Switch Bypassed).');
        } catch (err) {
          console.warn('[iOS-MediaChannel] Failed setting navigator.audioSession.type:', err);
        }
      } else {
        console.log('[iOS-MediaChannel] navigator.audioSession API not supported in this browser.');
      }
    }

    // Run on script load
    setPlaybackCategory();

    // 2. Gesture listener to kick the browser AudioContext into active media mode on tap
    let sessionInitialized = false;

    function activateMediaChannel(event) {
      console.log(`[iOS-MediaChannel] User gesture detected (${event.type}). Setting up media context...`);

      // Re-enforce playback mode inside user tap stack
      setPlaybackCategory();

      // Check browser WebAudio Context
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        try {
          const context = new AudioContextClass();
          console.log(`[iOS-MediaChannel] Created AudioContext. State: ${context.state}, BaseLatency: ${context.baseLatency}`);

          if (context.state === 'suspended') {
            context.resume().then(() => {
              console.log(`[iOS-MediaChannel] AudioContext resumed successfully! State: ${context.state}`);
              sessionInitialized = true;
              context.close();
            }).catch((err) => {
              console.error('[iOS-MediaChannel] Error resuming AudioContext:', err);
            });
          } else {
            sessionInitialized = true;
            context.close();
          }
        } catch (e) {
          console.error('[iOS-MediaChannel] Exception initializing AudioContext:', e);
        }
      } else {
        console.warn('[iOS-MediaChannel] WebAudio API not available.');
      }

      // Remove gesture listeners once executed
      if (sessionInitialized) {
        window.removeEventListener('pointerdown', activateMediaChannel);
        window.removeEventListener('touchstart', activateMediaChannel);
      }
    }

    window.addEventListener('pointerdown', activateMediaChannel, { passive: true });
    window.addEventListener('touchstart', activateMediaChannel, { passive: true });

    // 3. Keep media mode alive when switching tabs or resuming from Apple Music
    document.addEventListener('visibilitychange', function() {
      console.log(`[iOS-MediaChannel] Visibility changed to: ${document.visibilityState}`);
      if (document.visibilityState === 'visible') {
        setPlaybackCategory();
      }
    });
  })();
</script>
</body>
</html>
